<!DOCTYPE html>
<html lang=en>
<head>
    <meta charset=UTF-8>
    <title>Tester</title>
</head>
<body>
<vn-viewbox>
    <span slot=start-text>START</span>
    <vn-script autoplay>
        <vn-text>hello</vn-text>
        <vn-event></vn-event>
    </vn-script>
</vn-viewbox>
<script type=module>
    import {VNScript} from "./dist/vn-viewbox.js";

    document.querySelector('vn-event').timeout = 500;
    document.querySelector('vn-viewbox').addEventListener('vnscriptend', console.log, {once: true});
    console.log(String(new VNScript));
</script>
</body>
</html>
